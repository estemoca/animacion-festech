<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Efecto Finger Frame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0a0a0a;color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
.demo{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

.canvas-wrap canvas{display:block;background:#000;max-width:100%;max-height:100%;object-fit:contain}
#cam{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;z-index:-1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:1.5rem;pointer-events:none;z-index:2}
.overlay.hidden{display:none}
.overlay .note{font-size:.7rem;color:#6b7280;max-width:340px;line-height:1.5}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;pointer-events:auto}
.btn{border:1px solid rgba(255,255,255,.15);background:transparent;color:#d1d5db;padding:.45rem 1rem;border-radius:999px;font-size:.8rem;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#22d3ee;color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:#22d3ee;color:#0f172a;font-weight:600;border:none}
.btn.primary:hover{background:#67e8f9}
.btn.active{border-color:#22d3ee;color:#67e8f9}
.controls{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:.6rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;background:rgba(10,10,10,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.1)}
.filter-group{display:flex;flex-wrap:wrap;gap:.4rem}
.status{margin-left:auto;font-size:.7rem;color:#6b7280;font-variant-numeric:tabular-nums}
.error-msg{color:#fca5a5;font-size:.82rem;max-width:420px;text-align:center}
.loading-msg{color:#d1d5db;font-size:.82rem}

</head>

<script type="module">
import { HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ── Constantes ──────────────────────────────────────────────────────── */
const CDN   = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const FILTERS = [
  { id: "toon",    label: "Dibujos" },
  { id: "invert",  label: "Negativo" },
  { id: "comic",   label: "Cómic" },
  { id: "sketch",  label: "Lápiz" },
  { id: "pixel",   label: "Pixel" },
  { id: "noir",    label: "Noir" },
  { id: "glitch",  label: "Glitch" },
  { id: "vhs",     label: "VHS" },
  { id: "neon",    label: "Neón" },
  { id: "thermal", label: "Térmica" },
  { id: "ghibli",  label: "Ghibli" },
  { id: "simpsons", label: "Simpsons" },
];

const STAB = {
  openRatio: .75, keepRatio: .2,
  openArea: .005, keepArea: .0005,
  maxLostFrames: 25,
  teleportRatio: .3, teleportConfirmFrames: 2,
  minAlpha: .35, maxAlpha: .85, alphaSpeedRef: .05,
  fadeIn: .12, fadeOut: .05,
  mirrored: true,
};

/* ── DOM ─────────────────────────────────────────────────────────────── */
const video       = document.getElementById("cam");
const lienzo      = document.getElementById("lienzo");
const overlay     = document.getElementById("overlay");
const overlayL    = document.getElementById("overlayLoading");
const overlayE    = document.getElementById("overlayError");
const loadingMsg  = document.getElementById("loadingMsg");
const errorMsg    = document.getElementById("errorMsg");
const demoEl      = document.querySelector(".demo");
const statusEl    = document.getElementById("status");
const filterGroup = document.getElementById("filterGroup");
const btnOutline  = document.getElementById("btnOutline");

let currentFilter = "toon";
let outlineOn     = true;

/* ── Filtros UI ──────────────────────────────────────────────────────── */
FILTERS.forEach(f => {

  b.className = "btn" + (f.id === currentFilter ? " active" : "");
  b.textContent = f.label;
  b.onclick = () => { currentFilter = f.id; updateFilterBtns(); };
  filterGroup.appendChild(b);
});
function updateFilterBtns() {

    b.classList.toggle("active", FILTERS[i].id === currentFilter);
  });
}
btnOutline.onclick = () => { outlineOn = !outlineOn; btnOutline.classList.toggle("active", outlineOn); };
btnOutline.classList.add("active");

const btnFS = document.getElementById("btnFullscreen");
btnFS.onclick = () => {

    document.exitFullscreen();
  }
};

  const fs = !!document.fullscreenElement;
  btnFS.classList.toggle("active", fs);
  btnFS.textContent = fs ? "Salir" : "Fullscreen";
});
document.addEventListener("webkitfullscreenchange", () => {});

/* ── Stabilizer ──────────────────────────────────────────────────────── */
const W = 0, T = 4, I = 8, M = 9;
const K  = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
const centroid = pts => {
  const n = pts.length;
  return { x: pts.reduce((s, p) => s + p.x, 0) / n, y: pts.reduce((s, p) => s + p.y, 0) / n };
};
const polygonArea = pts => {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const n = pts[(i + 1) % pts.length];
    a += pts[i].x * n.y - n.x * pts[i].y;
  }
  return Math.abs(a / 2);
};
const sortByAngle = pts => {
  const c = centroid(pts);
  return [...pts].sort((a, b) =>
    Math.atan2(a.y - c.y, a.x - c.x) - Math.atan2(b.y - c.y, b.x - c.x));
};
const meanDist = (curr, prev) =>
  curr.reduce((s, p, i) => s + K(p, prev[i]), 0) / curr.length;

function createStabilizer() {
  let corners = null, alpha = 0, active = false, lostFrames = 0;
  let teleportCount = 0, handCount = 0;

  const snap = (p, cw, ch) => ({
    x: (STAB.mirrored ? 1 - p.x : p.x) * cw,
    y: p.y * ch,
  });

  function detectQuad(landmarks, cw, ch) {
    if (landmarks.length !== 2) return null;
    const tips = [];
    for (const hand of landmarks) {
      const wP = snap(hand[W], cw, ch);
      const tP = snap(hand[T], cw, ch);
      const iP = snap(hand[I], cw, ch);
      const mP = snap(hand[M], cw, ch);
      if (!wP || !tP || !iP || !mP) return null;
      const scale = K(wP, mP) + 1;
      const ratio = active ? STAB.keepRatio : STAB.openRatio;
      if (K(tP, iP) < scale * ratio) return null;
      tips.push(iP, tP);
    }
    if (tips.length !== 4) return null;
    const sorted = sortByAngle(tips);
    const minArea = active ? STAB.keepArea : STAB.openArea;
    return polygonArea(sorted) < cw * ch * minArea ? null : sorted;
  }

  function update(landmarks, cw, ch) {
    handCount = landmarks.length;
    const raw = landmarks.length === 2 ? detectQuad(landmarks, cw, ch) : null;

    if (!raw) {
      if (corners && ++lostFrames <= STAB.maxLostFrames) {
        alpha = Math.min(1, alpha + STAB.fadeIn);
      } else {
        alpha = Math.max(0, alpha - STAB.fadeOut);
        if (alpha === 0) { corners = null; active = false; lostFrames = 0; teleportCount = 0; }
      }
      return { corners, presence: alpha, active, hands: handCount };
    }

    if (!corners) {
      corners = raw; lostFrames = 0; teleportCount = 0;
      active = true;
      alpha = Math.min(1, alpha + STAB.fadeIn);
      return { corners, presence: alpha, active, hands: handCount };
    }

    const aligned = alignQuad(raw, corners);
    const dist = meanDist(aligned, corners);

    if (dist > cw * STAB.teleportRatio && ++teleportCount < STAB.teleportConfirmFrames) {
      lostFrames++;
      return { corners, presence: alpha, active, hands: handCount };
    }

    lostFrames = 0; teleportCount = 0; active = true;
    const speed = Math.min(STAB.maxAlpha, Math.max(STAB.minAlpha, dist / (cw * STAB.alphaSpeedRef)));
    corners = corners.map((c, i) => lerp(c, aligned[i], speed));
    alpha = Math.min(1, alpha + STAB.fadeIn);
    return { corners, presence: alpha, active, hands: handCount };
  }

  function reset() { corners = null; alpha = 0; active = false; lostFrames = 0; teleportCount = 0; handCount = 0; }

  return { update, reset };
}

function alignQuad(source, target) {
  let best = source, bestDist = Infinity;
  const variants = [source, [source[3], source[2], source[1], source[0]]];
  for (const v of variants) {
    for (let s = 0; s < 4; s++) {
      const rot = [v[s % 4], v[(s + 1) % 4], v[(s + 2) % 4], v[(s + 3) % 4]];
      const d = meanDist(rot, target);
      if (d < bestDist) { bestDist = d; best = rot; }
    }
  }
  return best;
}

/* ── WebGL2 renderer ─────────────────────────────────────────────────── */
const VERT = `#version 300 es
void main(){
  vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);
  gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2  uRes;
uniform float uTime;
uniform int   uEffect;
uniform float uPresence;
uniform vec2  uQuad[4];
uniform float uOutline;
out vec4 fragColor;

vec3 tex(vec2 p){
  return texture(uTex,vec2(1.0-p.x/uRes.x,p.y/uRes.y)).rgb;
}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
float hash(vec2 v){return fract(sin(dot(v,vec2(127.1,311.7)))*43758.5453);}
vec3 blur3(vec2 p,float s){
  vec3 sum=vec3(0.);
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++)
    sum+=tex(p+vec2(float(x),float(y))*s);
  return sum/9.;
}
float sobel(vec2 p,float s){
  float tl=lum(tex(p+vec2(-s,-s))),tc=lum(tex(p+vec2(0.,-s))),tr=lum(tex(p+vec2(s,-s)));
  float ml=lum(tex(p+vec2(-s,0.))),mr=lum(tex(p+vec2(s,0.)));
  float bl=lum(tex(p+vec2(-s,s))),bc=lum(tex(p+vec2(0.,s))),br=lum(tex(p+vec2(s,s)));
  float gx=-tl-2.*ml-bl+tr+2.*mr+br;
  float gy=-tl-2.*tc-tr+bl+2.*bc+br;
  return length(vec2(gx,gy));
}
vec3 posterize(vec3 c,float l){return floor(c*l+.5)/l;}
vec3 saturation(vec3 c,float a){return clamp(mix(vec3(lum(c)),c,a),0.,1.);}

vec3 fxToon(vec2 p){
  vec3 c=saturation(blur3(p,2.),1.45);
  c=posterize(c,5.);
  float ink=smoothstep(.55,1.15,sobel(p,1.5));
  return mix(c,vec3(.05,.045,.07),ink);
}
vec3 fxInvert(vec2 p){return 1.-tex(p);}
vec3 fxComic(vec2 p){
  vec3 c=posterize(saturation(blur3(p,2.),1.6),4.);
  float cell=max(3.,uRes.x/150.);
  float a=.42;
  vec2 rp=mat2(cos(a),-sin(a),sin(a),cos(a))*p;
  vec2 g=fract(rp/cell)-.5;
  float radius=sqrt(clamp(1.-lum(c),0.,1.))*.6;
  float dots=smoothstep(radius,radius-.14,length(g));
  c=mix(c,c*.32,dots*.6);
  float ink=smoothstep(.6,1.25,sobel(p,1.5));
  return mix(c,vec3(.05),ink);
}
vec3 fxSketch(vec2 p){
  float ink=smoothstep(.18,.85,sobel(p,1.2));
  float dark=1.-smoothstep(.08,.62,lum(blur3(p,3.)));
  float h1=step(.62,.5+.5*sin((p.x+p.y)*.55));
  float h2=step(.62,.5+.5*sin((p.x-p.y)*.55+1.7));
  float hatch=clamp(h1*step(.34,dark)+h2*step(.68,dark),0.,1.);
  float grain=hash(floor(p*.7))*.05;
  float v=1.-ink*.88-hatch*.42-dark*.12-grain;
  return clamp(vec3(v),0.,1.)*vec3(1.,.985,.95);
}
vec3 fxPixel(vec2 p){
  float blk=max(4.,uRes.x/64.);
  return tex((floor(p/blk)+.5)*blk);
}
vec3 fxNoir(vec2 p){
  float l=lum(tex(p));
  return vec3(clamp((l-.5)*1.8+.47,0.,1.));
}
vec3 fxGlitch(vec2 p){
  float t=floor(uTime*14.);
  float bandH=max(6.,uRes.y/40.);
  float band=floor(p.y/bandH);
  float roll=step(.72,hash(vec2(band,t+3.)));
  float shift=(hash(vec2(band,t))-.5)*uRes.x*.07*roll;
  vec2 q=p+vec2(shift,0.);
  float ca=5.+sin(uTime*9.)*4.;
  vec3 c=vec3(tex(q+vec2(ca,0.)).r,tex(q).g,tex(q-vec2(ca,0.)).b);
  c=saturation(c,1.55);
  return c*(.86+.14*step(.5,fract(p.y/4.)));
}
vec3 fxVhs(vec2 p){
  float wob=sin(p.y*.05+uTime*3.)*1.5+sin(p.y*.011+uTime*1.3)*3.;
  vec2 q=p+vec2(wob,0.);
  vec3 c=vec3(tex(q+vec2(3.,0.)).r,tex(q).g,tex(q-vec2(3.,0.)).b);
  c*=vec3(1.05,.98,1.07);
  c*=.88+.12*step(.5,fract(p.y/3.));
  c+=(hash(p+uTime*60.)-.5)*.09;
  vec2 d=p/uRes-.5;
  return clamp(c*(1.-dot(d,d)*.7),0.,1.);
}
vec3 fxNeon(vec2 p){
  float core=smoothstep(.18,.95,sobel(p,1.5));
  float halo=smoothstep(.10,.90,sobel(p,4.));
  float h=fract(lum(tex(p))*.6+uTime*.05);
  vec3 col=.5+.5*cos(6.28318*(h+vec3(0.,.33,.67)));
  return col*(core+halo*.55)+vec3(.02,.03,.06);
}
vec3 fxThermal(vec2 p){
  float l=lum(blur3(p,1.5));
  vec3 c=mix(vec3(.02,0.,.16),vec3(.55,0.,.55),smoothstep(0.,.35,l));
  c=mix(c,vec3(1.,.25,0.),smoothstep(.35,.68,l));
  c=mix(c,vec3(1.,.92,.35),smoothstep(.68,1.,l));
  return c;
}

vec3 fxGhibli(vec2 p){
  vec3 raw=blur3(p,1.8);
  float l=lum(raw);

  vec3 warm=vec3(1.20,.92,.70);
  vec3 cool=vec3(.65,.92,1.18);
  vec3 base=mix(cool,warm,smoothstep(.08,.92,l));
  base=base*base*2.2+.06;
  vec3 c=base*raw;
  c.r*=.90;c.g*=1.04;c.b*=1.08;

  c=saturation(c,1.25);
  float banded=floor(l*6.)/6.;
  c=mix(c,vec3(banded),.42);

  float ink=sobel(p,1.8);
  float line=smoothstep(.18,.85,ink*1.8);
  vec3 inkC=vec3(.06,.05,.09);
  c=mix(c,inkC,line*.92);

  float d=smoothstep(.50,.95,l);
  vec3 skyReflect=vec3(.72,.86,1.16);
  c=mix(c,skyReflect,d*.18);

  float bloom=smoothstep(.42,1.,l);
  c=mix(c,vec3(1.),bloom*.45);

  float grain=(hash(p+uTime*14.)-.5)*.03;
  c+=grain*l*.4;
  float vig=length(p/uRes-.5);
  c*=1.-smoothstep(.35,.9,vig)*.25;
  return clamp(c,0.,1.);
}

vec3 fxSimpsons(vec2 p){
  vec3 raw=blur3(p,1.6);
  float l=lum(raw);
  float cr=raw.r-max(raw.g,raw.b);
  float skin=clamp(((cr-l*.25)*6.5)*step(l,.95),0.,1.);
  skin=smoothstep(.12,.5,skin);

  vec3 simpsonsYellow=vec3(1.0,.80,.15);
  vec3 skinHi=vec3(1.0,.86,.30);
  vec3 skinLo=vec3(.85,.62,.10);
  vec3 skinC=mix(skinLo,skinHi,smoothstep(.25,.75,l));

  float banded=floor(l*5.)/5.;
  vec3 bg=vec3(banded);
  bg=bg*bg*1.5+vec3(0,0,.05);

  vec3 c=mix(bg,skinC,skin);
  c=mix(c,simpsonsYellow,skin*.25);
  c=saturation(c,1.6);

  float ink=sobel(p,1.8);
  float line=smoothstep(.15,.8,ink*2.0);
  c=mix(c,vec3(.05,.05,.08),line*.95);

  float grain=(hash(p+uTime*16.)-.5)*.035;
  c+=grain;
  return clamp(c,0.,1.);
}

vec3 applyEffect(vec2 p){
  if(uEffect==0)return fxToon(p);
  if(uEffect==1)return fxInvert(p);
  if(uEffect==2)return fxComic(p);
  if(uEffect==3)return fxSketch(p);
  if(uEffect==4)return fxPixel(p);
  if(uEffect==5)return fxNoir(p);
  if(uEffect==6)return fxGlitch(p);
  if(uEffect==7)return fxVhs(p);
  if(uEffect==8)return fxNeon(p);
  if(uEffect==9)return fxThermal(p);
  if(uEffect==10)return fxSimpsons(p);
  return fxGhibli(p);
}

float segDist(vec2 p,vec2 a,vec2 b,out float h){
  vec2 pa=p-a,ba=b-a;
  h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.);
  return length(pa-ba*h);
}
float quadSdf(vec2 p,out float arc){
  float d=1e9,acc=0.;bool inside=false;arc=0.;
  for(int i=0;i<4;i++){
    vec2 a=uQuad[i],b=uQuad[(i+1)%4];
    float h,dd=segDist(p,a,b,h);
    float len=length(b-a);
    if(dd<d){d=dd;arc=acc+h*len;}
    acc+=len;
    if(((a.y>p.y)!=(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))
      inside=!inside;
  }
  return inside?-d:d;
}

void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  vec3 col=tex(p);
  if(uPresence>.002){
    float arc;
    float sd=quadSdf(p,arc);
    float mask=(1.-smoothstep(-1.,1.,sd))*uPresence;
    if(mask>.002)col=mix(col,applyEffect(p),mask);
    if(uOutline>.5){
      float band=1.-smoothstep(.6,2.,abs(sd));
      float dash=step(.45,fract((arc-uTime*60.)/26.));
      float dot4=0.;
      for(int i=0;i<4;i++)
        dot4=max(dot4,1.-smoothstep(3.,5.,distance(p,uQuad[i])));
      float ink=max(band*dash,dot4)*uPresence;
      col=mix(col,vec3(1.),ink*.9);
    }
  }
  fragColor=vec4(col,1.);
}`;

function compileShader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error("Shader: " + gl.getShaderInfoLog(s));
  return s;
}

function initGL(canvas) {
  const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, preserveDrawingBuffer: true });
  if (!gl) throw new Error("No hay WebGL2");
  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compileShader(gl, gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error("Link: " + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const loc = n => gl.getUniformLocation(prog, n);
  const u = {
    res: loc("uRes"), time: loc("uTime"), effect: loc("uEffect"),
    presence: loc("uPresence"), quad: loc("uQuad"), outline: loc("uOutline"),
    tex: loc("uTex"),
  };

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.uniform1i(u.tex, 0);

  const quadArr = new Float32Array(8);

  return {
    draw(source, state, params) {
      const srcW = source.videoWidth || source.width  || 1280;
      const srcH = source.videoHeight|| source.height || 720;
      if (canvas.width !== srcW || canvas.height !== srcH) {
        canvas.width  = srcW;
        canvas.height = srcH;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);

      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);

      if (state.corners) {
        for (let i = 0; i < 4; i++) {
          quadArr[i * 2]     = state.corners[i].x;
          quadArr[i * 2 + 1] = state.corners[i].y;
        }
      }

      gl.uniform2f(u.res, canvas.width, canvas.height);
      gl.uniform1f(u.time, params.timeSec);
      gl.uniform1i(u.effect, FILTERS.findIndex(f => f.id === params.effect));
      gl.uniform1f(u.presence, state.corners ? state.presence : 0);
      gl.uniform2fv(u.quad, quadArr);
      gl.uniform1f(u.outline, params.outline ? 1 : 0);

      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
  };
}

/* ── Synthetic scene (sin cámara) ────────────────────────────────────── */
const SYNTH_W = 1280, SYNTH_H = 720;
const synthCanvas = document.createElement("canvas");
synthCanvas.width = SYNTH_W;
synthCanvas.height = SYNTH_H;
const sCtx = synthCanvas.getContext("2d");

function paintSynth(t) {
  const L = SYNTH_W, N = SYNTH_H;
  sCtx.fillStyle = "#0b1220";
  sCtx.fillRect(0, 0, L, N);
  ["#ef4444","#f59e0b","#22c55e","#22d3ee","#6366f1","#ec4899"].forEach((c, i) => {
    sCtx.fillStyle = c;
    sCtx.fillRect(0, i * N / 6, 130, N / 6);
  });
  for (let i = 0; i < 16; i++) {
    const v = Math.round(i / 15 * 255);
    sCtx.fillStyle = `rgb(${v},${v},${v})`;
    sCtx.fillRect(L - 130, i * N / 16, 130, N / 16);
  }
  const cx = L / 2 + Math.sin(t * .7) * 40;
  const cy = N * .42 + Math.sin(t * 1.1) * 14;
  sCtx.fillStyle = "#c9a37a";
  sCtx.beginPath(); sCtx.ellipse(cx, cy, 118, 150, 0, 0, Math.PI * 2); sCtx.fill();
  sCtx.fillStyle = "#2b2118";
  sCtx.beginPath(); sCtx.ellipse(cx, cy - 96, 122, 78, 0, Math.PI, Math.PI * 2); sCtx.fill();
  sCtx.fillStyle = "#1b1b22";
  for (const h of [-44, 44]) {
    sCtx.beginPath();
    sCtx.ellipse(cx + h, cy - 18, 17, 11 + Math.sin(t * 3.3) * 6, 0, 0, Math.PI * 2);
    sCtx.fill();
  }
  sCtx.strokeStyle = "#7d3b3b"; sCtx.lineWidth = 9;
  sCtx.beginPath(); sCtx.arc(cx, cy + 42, 46, .25, Math.PI - .25); sCtx.stroke();
  sCtx.fillStyle = "#2563eb";
  sCtx.beginPath(); sCtx.moveTo(cx - 210, N);
  sCtx.quadraticCurveTo(cx, N - 190, cx + 210, N); sCtx.closePath(); sCtx.fill();
}

function synthHands(t) {
  const toXY = (x, y) => ({ x: 1 - x, y, z: 0 });
  const mkHand = (idx, thumb, wrist, knuckle) => {
    const p = Array.from({ length: 21 }, () => ({ x: 0, y: 0, z: 0 }));
    p[W] = wrist; p[T] = thumb; p[I] = idx; p[M] = knuckle;
    return p;
  };
  const cx = .5 + Math.sin(t * .45) * .06;
  const cy = .5 + Math.sin(t * .31) * .05;
  const sc = .2 + Math.sin(t * .6) * .05;
  const rot = .15 + Math.cos(t * .5) * .03;
  const ang = Math.sin(t * .4) * .22;
  const C = Math.cos(ang), S = Math.sin(ang);
  const place = (dx, dy) => toXY(cx + dx * sc * C - dy * rot * S, cy + dx * sc * S + dy * rot * C);
  const up = (p, d) => ({ x: p.x, y: p.y + d, z: 0 });
  const l = place(-1, 1), r = place(1, 1);
  return [
    mkHand(place(-1, -1), l, up(l, .14), up(l, .05)),
    mkHand(place(1, -1), r, up(r, .14), up(r, .05)),
  ];
}

/* ── Main loop ───────────────────────────────────────────────────────── */
let renderer = null, stabilizer = null, landmarker = null;
let mediaStream = null, animId = -1, lastTime = -1;
let running = false, mode = null;
const fps = { val: 0, frames: 0, last: 0 };

function showOverlay(which) {
  overlay.classList.toggle("hidden", which !== "idle");
  overlayL.classList.toggle("hidden", which !== "loading");
  overlayE.classList.toggle("hidden", which !== "error");
}

async function startCamera() {
  showOverlay("loading");
  loadingMsg.textContent = "Pidiendo permiso de cámara y descargando el modelo de manos…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
      audio: false,
    });
    mediaStream = stream;
    video.srcObject = stream;
    await video.play();
    if (!video.videoWidth) await new Promise(r => video.addEventListener("loadeddata", r, { once: true }));

    lienzo.width  = video.videoWidth  || 1280;
    lienzo.height = video.videoHeight || 720;

    if (!landmarker) {
      const mp = await import(CDN);
      const fs = await mp.FilesetResolver.forVisionTasks(`${CDN}/wasm`);
      landmarker = await mp.HandLandmarker.createFromOptions(fs, {
        baseOptions: { modelAssetPath: MODEL, delegate: "GPU" },
        runningMode: "VIDEO", numHands: 2,
        minHandDetectionConfidence: .5,
        minHandPresenceConfidence: .5,
        minTrackingConfidence: .5,
      });
    }

    mode = "camera";
    running = true;
    demoEl.classList.add("running");
    showOverlay(null);
    loop(video);
  } catch (e) {
    const msg = e?.name === "NotAllowedError" || e?.name === "SecurityError"
      ? "No has dado permiso de cámara. Puedes probar el modo sin cámara."
      : "No se pudo abrir la cámara en este dispositivo.";
    showOverlay("error");
    errorMsg.textContent = msg;
  }
}

function startSynth() {
  showOverlay("loading");
  loadingMsg.textContent = "Preparando la escena…";
  lienzo.width  = SYNTH_W;
  lienzo.height = SYNTH_H;
  mode = "synth";
  running = true;
  demoEl.classList.add("running");
  showOverlay(null);
  loop(synthCanvas);
}

function stop() {
  if (animId !== -1) { cancelAnimationFrame(animId); animId = -1; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  video.srcObject = null;
  running = false; mode = null; lastTime = -1;
  stabilizer?.reset();
  demoEl.classList.remove("running");
  showOverlay("idle");
  statusEl.textContent = "en reposo";
}

function loop(source) {
  const t0 = performance.now();
  let frameCount = 0;

  const tick = () => {
    if (!running) return;
    const now = performance.now();
    const sec = (now - t0) / 1000;

    if (mode === "synth") paintSynth(sec);

    let state = { corners: null, presence: 0, active: false, hands: 0 };

    if (mode === "camera") {
      if (video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        const res = landmarker.detectForVideo(video, now);
        state = stabilizer.update(res.landmarks ?? [], lienzo.width, lienzo.height);
      } else {
        state = stabilizer.update([], lienzo.width, lienzo.height);
      }
    } else {
      state = stabilizer.update(synthHands(sec), lienzo.width, lienzo.height);
    }

    renderer.draw(source, state, {
      effect: currentFilter,
      outline: outlineOn,
      timeSec: sec,
    });

    frameCount++;
    if (now - fps.last >= 500) {
      fps.val = Math.round(frameCount * 1000 / (now - fps.last));
      fps.frames = state.hands;
      fps.last = now;
      frameCount = 0;
      const handText = `${state.hands} mano${state.hands === 1 ? "" : "s"}`;
      const frameText = state.active ? "marco activo" : "sin marco";
      statusEl.textContent = `${fps.val} fps · ${handText} · ${frameText}`;
    }

    animId = requestAnimationFrame(tick);
  };
  fps.last = performance.now();
  animId = requestAnimationFrame(tick);
}

/* ── Init ────────────────────────────────────────────────────────────── */
renderer   = initGL(lienzo);
stabilizer = createStabilizer();

document.getElementById("btnCamera").onclick = startCamera;
document.getElementById("btnSynth").onclick   = startSynth;
document.getElementById("btnSynth2").onclick  = startSynth;
document.getElementById("btnRetry").onclick   = () => { stop(); startCamera(); };

/* getUserMedia solo funciona en HTTPS / localhost */
if (!location.protocol.includes("https") && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
  document.getElementById("btnCamera").disabled = true;
  document.querySelector(".note").textContent =
    "La cámara requiere HTTPS o localhost. Pulsa 'Ver sin cámara' para probar el efecto.";
}
</script>
</body>
